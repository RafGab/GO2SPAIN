<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Descargar vídeo · Acero Pulido</title>
<style>
  :root { --plum:#3a1d2c; --mauve:#8a4a68; --cream:#faf5f3; --ink:#2b1a20; --soft:#6f5a61; --line:#ead9de; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: var(--cream); color: var(--ink); line-height: 1.55; font-size: 17px; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 24px 16px 48px; display: grid; gap: 16px; }
  h1 { font-family: Georgia, serif; color: var(--plum); font-size: 28px; line-height: 1.15; }
  p, li { color: var(--soft); }
  .btn { display: block; text-align: center; background: var(--plum); color: #fff; font-weight: 800; text-decoration: none; padding: 18px; border-radius: 999px; font-size: 19px; }
  ol { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 18px 18px 18px 38px; display: grid; gap: 8px; }
  video { width: 100%; border-radius: 16px; background: #000; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Vídeo de Acero Pulido</h1>
  <a class="btn" href="assets/ficha-acero-pulido.mp4" download="ficha-acero-pulido.mp4">Descargar el vídeo</a>
  <ol>
    <li>Pulsa <b>Descargar el vídeo</b> y confirma <b>Descargar</b>.</li>
    <li>Abre la app <b>Archivos</b> del iPhone, entra en <b>Descargas</b> y toca el vídeo.</li>
    <li>Toca el botón de compartir y elige <b>Guardar vídeo</b>.</li>
  </ol>
  <p>Si prefieres verlo antes, aquí está:</p>
  <video controls playsinline preload="metadata" src="assets/ficha-acero-pulido.mp4"></video>
</div>
</body>
</html>
